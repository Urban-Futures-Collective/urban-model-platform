# Production compose for Urban Model Platform v3.
# It does not (!) include a reverse proxy configuration, a nginx setup, or other
# specific production setups.
#
# Migrating from v2 (2.2.x)? Read the notes marked "v3 CHANGE" below and the
# breaking-change list in .env.example — several of them fail silently.


networks:
  prod:
    driver: bridge
    name: ${DOCKER_NETWORK:-ump_prod}
    external: true

volumes:
  # v3 CHANGE: new volume name. v3 owns its own Alembic lineage (0001/0002),
  # while the v2 database carries revisions 1.0.x in alembic_version. Pointing
  # v3 at the old volume makes `ump-migrate upgrade head` abort with
  # "Can't locate revision identified by '1.0.x'" and the container crash-loops.
  # A fresh volume is required; the old one is left untouched and can be removed
  # with `docker volume rm <project>_postgres_data` once the deploy is verified.
  ump_v3_postgres_data:

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CONTAINER_REGISTRY:-local}/${IMAGE_NAME:-urban-model-platform}:${IMAGE_TAG:-latest}
    restart: "unless-stopped"
    ports:
      # v3 CHANGE: the app listens on 8000 (uvicorn), not 5000 (Flask/gunicorn).
      - ${WEBAPP_PORT_EXTERNAL:-5003}:8000
    environment:
      # ── Server ────────────────────────────────────────────────────────────
      # Public base URL, used to build self/results links in job responses.
      UMP_API_SERVER_URL: ${UMP_API_SERVER_URL:-http://localhost:5003/}
      UMP_API_SERVER_HOST: 0.0.0.0
      UMP_API_SERVER_PORT: 8000
      UMP_API_SERVER_WORKERS: ${UMP_API_SERVER_WORKERS:-1}
      UMP_LOG_LEVEL: ${UMP_LOG_LEVEL:-INFO}
      UMP_PROVIDERS_FILE: ${UMP_PROVIDERS_FILE:-/home/pythonuser/providers.yaml}
      # v3 CHANGE: this no longer mounts the API. Routes are served at /v1.0/…
      # regardless; the prefix only decorates links. See .env.example.
      UMP_API_SERVER_URL_PREFIX: ${UMP_API_SERVER_URL_PREFIX:-/}

      # ── Providers / model registry ────────────────────────────────────────
      # v3 CHANGE: "db" serves the model registry (needs `ump-migrate upgrade head`);
      # providers.yaml is then ignored and NOT imported. "file" restores the old
      # behaviour.
      UMP_PROVIDERS_SOURCE: ${UMP_PROVIDERS_SOURCE:-db}
      UMP_PROVIDERS_DB_POLL_INTERVAL: ${UMP_PROVIDERS_DB_POLL_INTERVAL:-30}
      # JSON list syntax, e.g. ["en","de"]
      UMP_REGISTRY_LANGUAGES: '${UMP_REGISTRY_LANGUAGES:-["en","de"]}'
      # Outbound safety for user-supplied model-server URLs: https only unless
      # ALLOW_HTTP; private/loopback addresses only for the listed hosts
      # (e.g. ["modelserver"] for in-network model servers).
      UMP_REGISTRY_ALLOW_HTTP: ${UMP_REGISTRY_ALLOW_HTTP:-false}
      UMP_REGISTRY_ALLOWED_PRIVATE_HOSTS: ${UMP_REGISTRY_ALLOWED_PRIVATE_HOSTS:-[]}
      # DEV ONLY: false lets verifiers verify a model without a verification
      # run (four-eyes and the stored interface still apply). Keep it true in
      # production; the app logs a warning at startup when it is false.
      UMP_REGISTRY_REQUIRE_VERIFICATION_JOB: ${UMP_REGISTRY_REQUIRE_VERIFICATION_JOB:-true}
      UMP_INTERFACE_CHECK_INTERVAL_SECONDS: ${UMP_INTERFACE_CHECK_INTERVAL_SECONDS:-3600}

      # ── Email notifications ───────────────────────────────────────────────
      # none | log (mails go to the log) | smtp
      UMP_MAIL_BACKEND: ${UMP_MAIL_BACKEND:-none}
      UMP_MAIL_FROM: ${UMP_MAIL_FROM:-Urban Model Platform <noreply@example.org>}
      UMP_SMTP_HOST: ${UMP_SMTP_HOST:-localhost}
      UMP_SMTP_PORT: ${UMP_SMTP_PORT:-587}
      UMP_SMTP_SECURITY: ${UMP_SMTP_SECURITY:-starttls}
      # Optional settings (default None) are listed WITHOUT a value instead of
      # ${VAR:-}: Compose takes them from the shell or .env and leaves them unset
      # in the container when missing, so they stay None. ${VAR:-} would inject
      # "" instead; the current code happens to treat "" like None here, but not
      # for every optional setting (see UMP_REGISTRY_CREDENTIALS_KEY).
      UMP_SMTP_USER:
      UMP_SMTP_PASSWORD:
      UMP_FRONTEND_BASE_URL:
      UMP_NOTIFY_INTERVAL_SECONDS: ${UMP_NOTIFY_INTERVAL_SECONDS:-30}
      UMP_NOTIFY_SETTLE_SECONDS: ${UMP_NOTIFY_SETTLE_SECONDS:-5}
      UMP_NOTIFY_MAX_ATTEMPTS: ${UMP_NOTIFY_MAX_ATTEMPTS:-10}
      UMP_NOTIFY_FALLBACK_ADMIN_EMAILS: ${UMP_NOTIFY_FALLBACK_ADMIN_EMAILS:-[]}

      # ── Job store ─────────────────────────────────────────────────────────
      # v3 CHANGE: REQUIRED. Without it the default is "memory": jobs would live
      # in the process, the database would go unused, and the container would
      # most likely fail at startup trying to create ./scratch under /app.
      UMP_JOB_STORE: ${UMP_JOB_STORE:-postgres}
      UMP_DATABASE_NAME: ${UMP_DATABASE_NAME:-ump}
      UMP_DATABASE_USER: ${UMP_DATABASE_USER:-ump}
      UMP_DATABASE_PASSWORD: ${UMP_DATABASE_PASSWORD:-ump}
      UMP_DATABASE_HOST: ump-db
      UMP_DATABASE_PORT: 5432

      # ── Remote job handling ───────────────────────────────────────────────
      UMP_REMOTE_JOB_STATUS_REQUEST_INTERVAL: ${UMP_REMOTE_JOB_STATUS_REQUEST_INTERVAL:-5}
      UMP_VERIFY_REMOTE_RESULTS: ${UMP_VERIFY_REMOTE_RESULTS:-True}
      UMP_RESULTS_FETCH_TIMEOUT: ${UMP_RESULTS_FETCH_TIMEOUT:-30}
      UMP_JOB_DELETE_INTERVAL: ${UMP_JOB_DELETE_INTERVAL:-240}

      # ── Auth (external Keycloak) ──────────────────────────────────────────
      # v3 CHANGE: UMP_KEYCLOAK_* are gone. UMP validates JWTs offline against
      # the IdP's JWKS endpoint and never talks to Keycloak's admin API.
      UMP_AUTH_ENABLED: ${UMP_AUTH_ENABLED:-True}
      UMP_JWKS_URL: ${UMP_JWKS_URL}
      UMP_JWT_ISSUER: ${UMP_JWT_ISSUER}
      UMP_JWT_AUDIENCE: ${UMP_JWT_AUDIENCE}
      UMP_JWT_ROLES_CLAIMS: ${UMP_JWT_ROLES_CLAIMS:-realm_access.roles}
      UMP_JWKS_CACHE_TTL_SECONDS: ${UMP_JWKS_CACHE_TTL_SECONDS:-3600}
      UMP_PUBLIC_PROCESSES: ${UMP_PUBLIC_PROCESSES:-False}

      # ── CORS ──────────────────────────────────────────────────────────────
      # v3 CHANGE: v2 enabled CORS for all origins unconditionally. v3 emits no
      # CORS headers unless this is set. JSON list syntax, e.g.
      # UMP_CORS_ORIGINS=["https://frontend.example.org"]
      UMP_CORS_ORIGINS: ${UMP_CORS_ORIGINS:-[]}

      # ── Model registry ────────────────────────────────────────────────────
      # Fernet key(s) encrypting model-server credentials, comma-separated.
      # Deliberately listed WITHOUT a value instead of ${UMP_REGISTRY_CREDENTIALS_KEY}
      # or ${UMP_REGISTRY_CREDENTIALS_KEY:-}: Compose then takes the value from the
      # shell or .env and leaves the variable unset in the container when it is
      # missing there. An interpolated empty string would instead reach the app as
      # SecretStr("") rather than None, Fernet("") would raise, and the API would
      # fail at startup even on deployments that do not use the model registry.
      UMP_REGISTRY_CREDENTIALS_KEY:
    volumes:
      - ../files/providers.yaml:/home/pythonuser/providers.yaml
    networks:
      - prod
    depends_on:
      - ump-db

  ump-db:
    image: postgis/postgis:14-3.3
    restart: "unless-stopped"
    volumes:
      - ump_v3_postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${UMP_DATABASE_NAME}
      POSTGRES_USER: ${UMP_DATABASE_USER}
      POSTGRES_PASSWORD: ${UMP_DATABASE_PASSWORD}
    expose:
      - 5432
    networks:
      - prod

  # Geoserver and its database are intentionally absent: v3 has no result-storage
  # implementation yet, so nothing would write to them. Result storage arrives via
  # the ldproxy work on v3.0.0.alpha/result-storage (Feature V).
  #
  # Keycloak is intentionally absent: this deployment uses an externally managed
  # instance, configured through UMP_JWKS_URL / UMP_JWT_ISSUER above.
