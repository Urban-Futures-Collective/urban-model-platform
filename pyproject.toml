[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
# same as isort, black
line-length = 88
# Assume Python 3.8
target-version = "py314"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.poetry]
name = "ump"
version = "3.0.0-alpha8"
description = "server federation api, OGC Api Processes-based to connect model servers and centralize access to them"
authors = [
    "Rico Herzog <rico.herzog@hcu-hamburg.de>",
    "Maja Richter <maja.richter@gv.hamburg.de>",
    "Stefan Schuhart <stefan.schuhart@gv.hamburg.de>"
]
readme = "README.md"
package-mode = true

[tool.poetry.scripts]
ump         = "ump.cli:main"
ump-migrate = "ump.cli:migrate"

[tool.poetry.urls]
Homepage = "https://citysciencelab.github.io/urban-model-platform"
Documentation = "https://github.com/citysciencelab/urban-model-platform"
Changelog = "https://github.com/citysciencelab/urban-model-platform/changelog.md"
Repository = "https://github.com/citysciencelab/urban-model-platform"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiohttp = "^3.14.5"
python-dotenv = "^1.2.4"
gunicorn = "^26.2.0"
pyyaml = "^6.0.2"
watchdog = "^6.0.0"
pydantic-settings = "^2.16.0"
pydantic = "^2.14.1"
uvicorn = "^0.54.0"
fastapi = "^0.146.0"
jinja2 = "^3.1.6"
tenacity = "^9.2.1"
sqlmodel = "^0.0.48"
alembic = "^1.20.0"
asyncpg = "^0.32.0"
greenlet = "^3.5.6"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
rich = "^15.0.0"

[tool.poetry.group.dev.dependencies]
# formatting, quality, tests
autoflake = "^2.4.0"
black = "^26.10.1"
isort = "^9.0.2"
mypy = "^2.4.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-randomly = "^5.0.0"
pytest-sugar = "^1.1.1"
pytest-xdist = "^3.8.0"
types-toml = "^0.10.8.20260518"
pre-commit = "^4.7.0"
debugpy = "^1.8.22"
flake8 = "^7.4.1"
pylint = "^4.1.3"
bump-my-version = "^1.6.3"
pytest-asyncio = "^1.4.0"
pytest-mock = "^3.17.0"
requests = "^2.34.2"
httpx = "^0.28.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
jupyter-book = "^1"
sphinx-autoapi = "^3"
sphinxcontrib-autoyaml = "^1.1"

[tool.black]
line-length = 88
exclude = "tests/fixtures"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
force_single_line = false
balanced_wrapping = true
default_section = "THIRDPARTY"
known_first_party = "ump"
include_trailing_comma = true
